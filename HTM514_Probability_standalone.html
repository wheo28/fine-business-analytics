<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTM 514 Interactive — Probability &amp; Distribution Explorer</title>
<meta name="description" content="Optional HTM 514 practice interactive: recognizing whether a question calls for a normal, binomial, or Poisson model.">
<style>
/* ==========================================================================
   HTM 514 Interactive — common shell stylesheet
   Purdue-compatible restrained palette: white, black, Boilermaker Gold, grays.
   Reused by every HTM 514 interactive module.
   ========================================================================== */

:root {
  --gold: #CFB991;
  --gold-deep: #8E7B4F;
  --gold-wash: #F7F3EA;
  --ink: #131313;
  --ink-soft: #3D3D3D;
  --gray: #6B6B6B;
  --rule: #DCDCDC;
  --rule-soft: #EDEDED;
  --panel: #FAFAFA;
  --ok: #1F5C3D;
  --no: #8A2B22;
  --maxw: 880px;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: #FFFFFF;
  color: var(--ink);
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
}

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 28px 20px 72px;
}

/* ---------- masthead ---------- */

.masthead { border-bottom: 3px solid var(--gold); padding-bottom: 14px; margin-bottom: 26px; }

.eyebrow {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--gray);
  margin: 0 0 6px;
}

.masthead h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 27px;
  line-height: 1.25;
  margin: 0 0 6px;
  font-weight: 600;
}

.masthead .sub { margin: 0; color: var(--ink-soft); font-size: 15px; }

.fit {
  margin-top: 10px;
  font-size: 13px;
  color: var(--gray);
}

/* ---------- steps ---------- */

.step {
  border-top: 1px solid var(--rule);
  padding: 22px 0 6px;
}

.step[data-locked="true"] { opacity: .45; }
.step[data-locked="true"] .step-body { display: none; }

.step-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}

.step-num {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  background: var(--gold);
  border-radius: 2px;
  padding: 2px 8px;
  flex: 0 0 auto;
}

.step h2 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 19px;
  font-weight: 600;
  margin: 0;
}

.step .hint { font-size: 13px; color: var(--gray); margin: 0 0 12px; }

/* ---------- generic content ---------- */

p { margin: 0 0 12px; }
.scenario-text { font-family: Georgia, "Times New Roman", serif; font-size: 16.5px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--rule);
  padding: 14px 16px;
  margin: 0 0 14px;
}

.panel h3 {
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--gray);
  margin: 0 0 8px;
  font-weight: 700;
}

.meaning { display: grid; grid-template-columns: 1fr; gap: 10px; }
.meaning div { border-left: 3px solid var(--gold); padding-left: 12px; }
.meaning strong { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--gray); }

/* ---------- controls ---------- */

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-end;
  margin-bottom: 16px;
}

.control { display: flex; flex-direction: column; gap: 4px; }
.control label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--gray); }

button, select, input[type="range"] { font: inherit; }

button {
  background: #FFFFFF;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 8px 14px;
  cursor: pointer;
  border-radius: 2px;
}

button:hover { background: var(--gold-wash); }
button.primary { background: var(--gold); border-color: var(--gold-deep); font-weight: 600; }
button.primary:hover { background: #C4AC7E; }
button.quiet { border-color: var(--rule); color: var(--ink-soft); }
button[disabled] { opacity: .45; cursor: not-allowed; }

select { padding: 7px 8px; border: 1px solid var(--rule); border-radius: 2px; background: #fff; }

input[type="range"] { width: 190px; accent-color: var(--gold-deep); }

:focus-visible {
  outline: 3px solid var(--gold-deep);
  outline-offset: 2px;
}

.checkline { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); }

/* ---------- choice sets (prediction + quick check) ---------- */

.choices { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }

.choice {
  text-align: left;
  padding: 10px 14px;
  border: 1px solid var(--rule);
  background: #fff;
  border-radius: 2px;
  cursor: pointer;
  line-height: 1.45;
}

.choice:hover { border-color: var(--ink); background: var(--gold-wash); }
.choice[aria-pressed="true"] { border-color: var(--gold-deep); border-left-width: 5px; background: var(--gold-wash); }
.choice[data-verdict="ok"] { border-color: var(--ok); border-left: 5px solid var(--ok); }
.choice[data-verdict="no"] { border-color: var(--no); border-left: 5px solid var(--no); }

.feedback {
  border-left: 4px solid var(--gold);
  background: var(--gold-wash);
  padding: 12px 14px;
  margin: 0 0 12px;
  font-size: 15px;
}
.feedback[data-verdict="ok"] { border-left-color: var(--ok); }
.feedback[data-verdict="no"] { border-left-color: var(--no); }
.feedback .verdict { font-weight: 700; }

/* ---------- charts + readouts ---------- */

.charts { display: grid; grid-template-columns: 1fr; gap: 18px; margin-bottom: 16px; }
@media (min-width: 720px) { .charts { grid-template-columns: 1fr 1fr; } }

.chart-box { border: 1px solid var(--rule); padding: 10px 12px 12px; }
.chart-box h3 { font-size: 13px; margin: 0 0 2px; font-weight: 700; }
.chart-box .cap { font-size: 12px; color: var(--gray); margin: 0 0 8px; }
canvas { width: 100%; height: auto; display: block; }

.readout { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 14px; }
.readout caption { caption-side: top; text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gray); padding-bottom: 6px; }
.readout th, .readout td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule-soft); }
.readout th { font-weight: 600; color: var(--ink-soft); }
.readout td.num { font-variant-numeric: tabular-nums; }

.runlog th, .runlog td { text-align: right; }
.runlog th:first-child, .runlog td:first-child { text-align: left; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.footer {
  margin-top: 34px;
  border-top: 1px solid var(--rule);
  padding-top: 12px;
  font-size: 12.5px;
  color: var(--gray);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
/* ==========================================================================
   HTM 514 Interactive — common shell (vanilla JS, no dependencies)

   Provides the pieces every HTM 514 mini-module reuses:
     HTM514.rng          seeded pseudo-random generator (reproducible)
     HTM514.draw         random variates built on a seeded rng
     HTM514.stats        mean, population/sample SD, min, max, binning
     HTM514.fmt          number formatting helpers
     HTM514.Steps        progressive step disclosure (locked -> unlocked)
     HTM514.Choices      one prediction / quick-check question with feedback
     HTM514.QuickCheck   randomized draw from a question pool
     HTM514.Histogram    canvas histogram with a shared x-axis + text summary
     HTM514.mount        assembles the page from a module definition

   A module supplies content and its own "Try it" panel; the shell supplies
   layout, flow, feedback, and charting.
   ========================================================================== */

(function (global) {
  "use strict";

  /* ---------- seeded RNG (mulberry32) ---------- */

  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var draw = {
    normal: function (r, mu, sd) {
      var u = 1 - r(), v = r();
      return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
    exponential: function (r, theta) { return -Math.log(1 - r()) * theta; },
    gamma: function (r, shapeInt, theta) {
      var s = 0;
      for (var i = 0; i < shapeInt; i++) s += draw.exponential(r, theta);
      return s;
    },
    poisson: function (r, lambda) {
      var L = Math.exp(-lambda), k = 0, p = 1;
      do { k++; p *= r(); } while (p > L);
      return k - 1;
    }
  };

  /* ---------- statistics ---------- */

  var stats = {
    mean: function (a) { var s = 0, i; for (i = 0; i < a.length; i++) s += a[i]; return s / a.length; },
    sdPop: function (a) {
      var m = stats.mean(a), s = 0, i;
      for (i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m);
      return Math.sqrt(s / a.length);
    },
    sdSample: function (a) {
      if (a.length < 2) return NaN;
      var m = stats.mean(a), s = 0, i;
      for (i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m);
      return Math.sqrt(s / (a.length - 1));
    },
    min: function (a) { return Math.min.apply(null, a); },
    max: function (a) { return Math.max.apply(null, a); },
    bin: function (values, lo, hi, k) {
      var counts = new Array(k), i, idx, w = (hi - lo) / k;
      for (i = 0; i < k; i++) counts[i] = 0;
      for (i = 0; i < values.length; i++) {
        idx = Math.floor((values[i] - lo) / w);
        if (idx < 0) idx = 0;
        if (idx >= k) idx = k - 1;
        counts[idx]++;
      }
      return counts;
    }
  };

  /* ---------- formatting ---------- */

  var fmt = {
    n: function (x, d) {
      if (!isFinite(x)) return "—";
      return x.toFixed(d === undefined ? 2 : d);
    },
    withUnit: function (x, unit, d) {
      if (!isFinite(x)) return "—";
      var v = fmt.n(x, d);
      return unit.prefix ? unit.prefix + v : v + (unit.suffix || "");
    }
  };

  /* ---------- small DOM helpers ---------- */

  function h(tag, attrs, kids) {
    var node = document.createElement(tag), k;
    if (attrs) for (k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k.indexOf("on") === 0) node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function announce(msg) {
    var live = document.getElementById("htm514-live");
    if (live) live.textContent = msg;
  }

  /* ---------- step flow ---------- */

  function Steps(root) { this.root = root; this.list = []; }

  Steps.prototype.add = function (opts) {
    var body = h("div", { class: "step-body" });
    var sec = h("section", { class: "step", id: "step-" + opts.id }, [
      h("div", { class: "step-head" }, [
        h("span", { class: "step-num", text: String(this.list.length + 1) }),
        h("h2", { text: opts.title })
      ]),
      body
    ]);
    if (opts.hint) body.appendChild(h("p", { class: "hint", text: opts.hint }));
    if (opts.locked) sec.setAttribute("data-locked", "true");
    this.root.appendChild(sec);
    var entry = { id: opts.id, section: sec, body: body };
    this.list.push(entry);
    return entry;
  };

  Steps.prototype.unlock = function (id, focusIt) {
    var e = this.list.filter(function (s) { return s.id === id; })[0];
    if (!e) return;
    e.section.removeAttribute("data-locked");
    if (focusIt) e.section.scrollIntoView({ block: "nearest" });
  };

  /* ---------- one multiple-choice question with feedback ---------- */

  function Choices(question, onAnswer) {
    // question: {stem, options:[{text, correct, why}], shuffle:false to keep order}
    if (question.shuffle !== false) {
      var opts = question.options.slice(), j, tmp, i2;
      for (i2 = opts.length - 1; i2 > 0; i2--) {
        j = Math.floor(Math.random() * (i2 + 1));
        tmp = opts[i2]; opts[i2] = opts[j]; opts[j] = tmp;
      }
      question = { stem: question.stem, options: opts };
    }
    var wrap = h("div");
    if (question.stem) wrap.appendChild(h("p", { class: "scenario-text", html: question.stem }));
    var box = h("div", { class: "choices" });
    var fb = h("div", { class: "feedback", hidden: "hidden" });
    var answered = false;

    question.options.forEach(function (opt, i) {
      var b = h("button", {
        class: "choice", type: "button", "aria-pressed": "false", html: opt.text,
        onclick: function () {
          if (answered) return;
          answered = true;
          Array.prototype.forEach.call(box.children, function (c, j) {
            c.setAttribute("aria-pressed", j === i ? "true" : "false");
            if (question.options[j].correct) c.setAttribute("data-verdict", "ok");
            else if (j === i) c.setAttribute("data-verdict", "no");
          });
          var verdict = opt.correct ? "ok" : "no";
          fb.setAttribute("data-verdict", verdict);
          fb.innerHTML = '<span class="verdict">' + (opt.correct ? "Correct." : "Not quite.") + "</span> " + opt.why;
          fb.hidden = false;
          announce((opt.correct ? "Correct. " : "Not quite. ") + fb.textContent);
          if (onAnswer) onAnswer(i, opt);
        }
      });
      box.appendChild(b);
    });

    wrap.appendChild(box);
    wrap.appendChild(fb);
    this.el = wrap;
  }

  /* ---------- quick check: randomized draw from a pool ---------- */

  function QuickCheck(pool, seed) {
    var self = this;
    var r = rng(seed || 20240514);
    var used = [];
    var host = h("div");
    var slot = h("div");
    var again = h("button", {
      class: "quiet", type: "button", text: "Another question",
      onclick: function () { self.next(); }
    });

    this.next = function () {
      if (used.length >= pool.length) used = [];
      var candidates = pool.map(function (q, i) { return i; }).filter(function (i) { return used.indexOf(i) < 0; });
      var pick = candidates[Math.floor(r() * candidates.length)];
      used.push(pick);
      slot.innerHTML = "";
      slot.appendChild(new Choices(pool[pick]).el);
    };

    host.appendChild(slot);
    host.appendChild(again);
    this.el = host;
    this.next();
  }

  /* ---------- canvas histogram ---------- */

  function Histogram(canvas, opts) {
    this.c = canvas;
    this.opts = opts || {};
    this.values = [];
    this.marks = [];
  }

  Histogram.prototype.set = function (values, marks) {
    this.values = values || [];
    this.marks = marks || [];
    this.render();
  };

  Histogram.prototype.render = function () {
    var o = this.opts, c = this.c;
    var dpr = global.devicePixelRatio || 1;
    var W = c.clientWidth || 400, H = o.height || 190;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.height = H + "px";
    var g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);

    var padL = 6, padR = 6, padB = 26, padT = 8;
    var lo = o.lo, hi = o.hi, k = o.bins || 44;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var counts = this.values.length ? stats.bin(this.values, lo, hi, k) : new Array(k).fill(0);
    var peak = Math.max.apply(null, counts) || 1;
    var bw = plotW / k;

    // bars
    g.fillStyle = o.fill || "#CFB991";
    g.strokeStyle = "#8E7B4F";
    g.lineWidth = 0.5;
    for (var i = 0; i < k; i++) {
      if (!counts[i]) continue;
      var bh = (counts[i] / peak) * plotH;
      var x = padL + i * bw;
      g.fillRect(x, padT + plotH - bh, Math.max(bw - 0.6, 0.8), bh);
      g.strokeRect(x, padT + plotH - bh, Math.max(bw - 0.6, 0.8), bh);
    }

    // baseline
    g.strokeStyle = "#131313"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(padL, padT + plotH + 0.5); g.lineTo(W - padR, padT + plotH + 0.5); g.stroke();

    // vertical marks (e.g., the true population mean)
    var self = this;
    this.marks.forEach(function (m) {
      if (m.value < lo || m.value > hi) return;
      var x = padL + ((m.value - lo) / (hi - lo)) * plotW;
      g.save();
      g.strokeStyle = m.color || "#131313";
      g.setLineDash(m.dash || [4, 3]);
      g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(x, padT); g.lineTo(x, padT + plotH); g.stroke();
      g.restore();
      if (m.label) {
        g.fillStyle = "#131313";
        g.font = "11px Segoe UI, Arial, sans-serif";
        var tw = g.measureText(m.label).width;
        var tx = Math.min(Math.max(x - tw / 2, padL), W - padR - tw);
        g.fillText(m.label, tx, padT + 10);
      }
      void self;
    });

    // axis labels
    g.fillStyle = "#6B6B6B";
    g.font = "11px Segoe UI, Arial, sans-serif";
    g.fillText(o.loLabel || "", padL, H - 8);
    var hiLab = o.hiLabel || "";
    g.fillText(hiLab, W - padR - g.measureText(hiLab).width, H - 8);
    if (o.axisLabel) {
      var al = o.axisLabel;
      g.fillText(al, padL + plotW / 2 - g.measureText(al).width / 2, H - 8);
    }
  };

  /* ---------- page assembly ---------- */

  function mount(module) {
    var root = document.getElementById("app");
    root.innerHTML = "";

    root.appendChild(h("header", { class: "masthead" }, [
      h("p", { class: "eyebrow", text: "HTM 514 Interactive · optional practice" }),
      h("h1", { text: module.title }),
      h("p", { class: "sub", text: module.subtitle }),
      h("p", { class: "fit", text: module.courseFit })
    ]));

    var steps = new Steps(root);
    module.build(steps, { h: h, announce: announce });

    root.appendChild(h("div", { class: "footer", html: module.footer || "" }));
    root.appendChild(h("div", { id: "htm514-live", class: "sr-only", "aria-live": "polite" }));
  }

  global.HTM514 = {
    rng: rng, draw: draw, stats: stats, fmt: fmt,
    h: h, announce: announce,
    Steps: Steps, Choices: Choices, QuickCheck: QuickCheck, Histogram: Histogram,
    mount: mount
  };

  if (typeof module !== "undefined" && module.exports) module.exports = global.HTM514;

})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ==========================================================================
   HTM 514 Interactive — Module 3.5
   "Probability & Distribution Explorer"

   Maps to Week 3 — Probability Theory: Probability & Distribution (Chapter 6)
   in the eight-week 2025 online course. That mapping lives in the README and in
   this comment only: the student-facing page is concept-named and week-neutral,
   so it can be allocated wherever Brightspace needs it. (The "Module 3.5"
   heading above is development numbering, normalized in the final packaging
   pass.)

   One idea only, and it is the distinction the Week 7 deck of the earlier
   sixteen-week delivery states in the instructor's own words:

     "Binomial distribution describes the number of successes in a fixed
      number of trials... Poisson distribution describes the number of events
      that occur in a fixed interval of time or space."

   Uses the frozen shell in assets/htm514-shell.js without modification.
   No network, no storage.
   ========================================================================== */

(function (global) {
  "use strict";

  var HAS_DOM = typeof document !== "undefined";
  var H = global.HTM514 ||
    (typeof require === "function" ? require("../assets/htm514-shell.js") : null);

  /* ================================================================= math ==
     Normal: Hart's double-precision rational approximation to the standard
     normal CDF (absolute error below 1e-15 across the supported range).
     Binomial and Poisson: computed in logs through a Lanczos log-gamma, so
     no factorial ever overflows at the sample sizes this module allows.
     All three are validated in tests against independently known values.
     ====================================================================== */

  function stdNormalCdf(x) {
    var a = Math.abs(x), cum, e, build;
    if (a > 37) {
      cum = 0;
    } else {
      e = Math.exp(-a * a / 2);
      if (a < 7.07106781186547) {
        build = 3.52624965998911e-02 * a + 0.700383064443688;
        build = build * a + 6.37396220353165;
        build = build * a + 33.912866078383;
        build = build * a + 112.079291497871;
        build = build * a + 221.213596169931;
        build = build * a + 220.206867912376;
        cum = e * build;
        build = 8.83883476483184e-02 * a + 1.75566716318264;
        build = build * a + 16.064177579207;
        build = build * a + 86.7807322029461;
        build = build * a + 296.564248779674;
        build = build * a + 637.333633378831;
        build = build * a + 793.826512519948;
        build = build * a + 440.413735824752;
        cum = cum / build;
      } else {
        build = a + 0.65;
        build = a + 4 / build;
        build = a + 3 / build;
        build = a + 2 / build;
        build = a + 1 / build;
        cum = e / (build * 2.506628274631);
      }
    }
    return x > 0 ? 1 - cum : cum;
  }

  function normalCdf(x, mu, sd) {
    if (!isFinite(x) || !isFinite(mu) || !(sd > 0)) return null;
    return stdNormalCdf((x - mu) / sd);
  }
  /* P(X > x) */
  function normalTail(x, mu, sd) {
    var c = normalCdf(x, mu, sd);
    return c === null ? null : 1 - c;
  }
  /* P(lo < X < hi) */
  function normalBetween(lo, hi, mu, sd) {
    var a = normalCdf(lo, mu, sd), b = normalCdf(hi, mu, sd);
    if (a === null || b === null) return null;
    return Math.max(0, b - a);
  }
  function normalPdf(x, mu, sd) {
    return Math.exp(-((x - mu) * (x - mu)) / (2 * sd * sd)) / (sd * Math.sqrt(2 * Math.PI));
  }

  function lnGamma(z) {
    var g = [676.5203681218851, -1259.1392167224028, 771.32342877765313,
             -176.61502916214059, 12.507343278686905, -0.13857109526572012,

  function binomPmf(k, n, p) {
    if (!(n >= 0) || k < 0 || k > n || k !== Math.round(k) || n !== Math.round(n)) return 0;
    if (!(p >= 0) || !(p <= 1)) return null;
    if (p === 0) return k === 0 ? 1 : 0;
    if (p === 1) return k === n ? 1 : 0;
    return Math.exp(lnChoose(n, k) + k * Math.log(p) + (n - k) * Math.log(1 - p));

     an upper tail that is small the complement loses precision, so the value
     itself is summed directly out there. The two agree far beyond the three

          ". Expected count under the model: " + mean.toFixed(2) + ".";
        working.innerHTML = "<strong>Complement rule:</strong> P(X \u2265 " + k + ") = 1 \u2212 P(X " +
          "\u2264 " + (k - 1) + ") = 1 \u2212 " + fmtProb(cdfBelow) + " = " + fmtProb(p) +
          ". " + f.excel;
        H.announce("Probability " + fmtProb(p) + ".");
      }

      /* --------------------------------------------------------------- svg - */

      function drawNormal(mu, sd, x) {
        var f = state.f;
        var W = 640, L = 30, R = 24, T = 16, B = 34, Ht = 200;
        var pw = W - L - R, ph = Ht - T - B;
        var lo = f.axis[0], hi = f.axis[1];
        var X = function (v) { return L + ((v - lo) / (hi - lo)) * pw; };
        // fixed vertical scale: the tallest curve the controls allow
        var peak = normalPdf(0, 0, f.controls.sd.min);
        var Y = function (d) { return T + ph - (d / peak) * (ph - 8); };
        while (chart.firstChild) chart.removeChild(chart.firstChild);

        // shaded tail beyond the threshold
        var pts = [], i, v;
        for (i = 0; i <= 80; i++) {
          v = x + (hi - x) * (i / 80);
          pts.push(X(v) + "," + Y(normalPdf(v, mu, sd)));
        }
        pts.push(X(hi) + "," + Y(0), X(x) + "," + Y(0));
        chart.appendChild(svgEl("polygon", { points: pts.join(" "),
          fill: "#CFB991", stroke: "#8E7B4F", "stroke-width": 1 }));

        // the curve
        var d = [], j, vv;
        for (j = 0; j <= 200; j++) {
          vv = lo + (hi - lo) * (j / 200);
          d.push((j ? "L" : "M") + X(vv) + " " + Y(normalPdf(vv, mu, sd)));
        }
        chart.appendChild(svgEl("path", { d: d.join(" "), fill: "none",
          stroke: "#131313", "stroke-width": 1.5 }));

        line(chart, L, Y(0), L + pw, Y(0), "#131313", 1);
        line(chart, X(mu), Y(0), X(mu), Y(normalPdf(mu, mu, sd)), "#131313", 1, "3,3");
        txt(chart, X(mu), T + 10, "mean " + mu.toFixed(1), "11", "#131313", "middle");
        line(chart, X(x), Y(0) + 6, X(x), T + 20, "#131313", 2);
        txt(chart, X(x), T + 16, "threshold " + x.toFixed(1), "11", "#131313", "middle");

        axisTicks(X, Y(0), lo, hi, function (v) { return v.toFixed(0); });
        chartCap.textContent = "Normal model, mean " + mu.toFixed(1) + " and standard deviation " +
          sd.toFixed(1) + ". The shaded area to the right of the threshold is the probability. The " +
          "horizontal and vertical scales are fixed, so a larger standard deviation visibly flattens " +
          "and widens the curve.";
        chart.setAttribute("aria-label", "Normal density curve with mean " + mu.toFixed(1) +
          " and standard deviation " + sd.toFixed(1) + ", with the area beyond " + x.toFixed(1) +
          " shaded. That area is " + fmtProb(normalTail(x, mu, sd)) + ".");
      }

      function drawDiscrete() {
        var f = state.f;
        var W = 640, L = 30, R = 24, T = 16, B = 34, Ht = 200;
        var pw = W - L - R, ph = Ht - T - B;
        var lo = f.axis[0], hi = f.axis[1];
        var X = function (v) { return L + ((v - lo) / (hi - lo)) * pw; };
        var k = val("k"), i, pr, probs = [], peak = 0;
        for (i = lo; i <= hi; i++) {
          pr = f.id === "binomial" ? binomPmf(i, val("n"), val("p")) : poisPmf(i, val("lambda"));
          probs.push(pr);
          if (pr > peak) peak = pr;
        }
        // fixed vertical scale so the bars do not rescale on every change
        var vmax = f.vmax;
        var Y = function (p) { return T + ph - (Math.min(p, vmax) / vmax) * (ph - 8); };
        while (chart.firstChild) chart.removeChild(chart.firstChild);

        var bw = Math.max(3, (pw / (hi - lo + 1)) - 2);
        probs.forEach(function (pr2, idx) {
          var v = lo + idx;
          var inTail = v >= k;
          var x0 = X(v) - bw / 2, y0 = Y(pr2);
          chart.appendChild(svgEl("rect", { x: x0, y: y0, width: bw, height: Math.max(0, Y(0) - y0),
            fill: inTail ? "#CFB991" : "#FFFFFF", stroke: "#131313", "stroke-width": 1 }));
        });
        line(chart, L, Y(0), L + pw, Y(0), "#131313", 1);
        line(chart, X(k) - bw / 2 - 2, T + 6, X(k) - bw / 2 - 2, Y(0), "#131313", 2, "4,3");
        txt(chart, Math.min(X(k) + 40, L + pw - 4), T + 12, "shaded: X \u2265 " + k, "11", "#131313", "middle");

        axisTicks(X, Y(0), lo, hi, function (v) { return String(Math.round(v)); });
        chartCap.textContent = (f.id === "binomial" ? "Binomial" : "Poisson") +
          " probabilities, one bar per possible count. Filled bars are the counts included in " +
          "X \u2265 " + k + "; the dashed line marks k. Both scales are fixed, so changing the " +
          "controls moves the distribution rather than the axes.";
        chart.setAttribute("aria-label", (f.id === "binomial" ? "Binomial" : "Poisson") +
          " probability bars from " + lo + " to " + hi + ". The bars from " + k +
          " upward are shaded and total " + fmtProb(f.id === "binomial"
            ? binomTail(k, val("n"), val("p")) : poisTail(k, val("lambda"))) + ".");
      }

      function axisTicks(X, y0, lo, hi, fmt) {
        [0, 0.25, 0.5, 0.75, 1].forEach(function (t) {
          var v = lo + t * (hi - lo);
          line(chart, X(v), y0, X(v), y0 + 4, "#131313", 1);
          txt(chart, X(v), y0 + 17, fmt(v), "11", "#6B6B6B", "middle");
        });
      }

      /* ------------------------------------------------------------ step 4 - */

      function renderCompare() {
        compareSlot.innerHTML = "";
        compareSlot.appendChild(new H.Choices({
          stem: "Why is \u201C3 no-shows among 20 reservations\u201D naturally binomial, while " +
                "\u201C3 walk-in arrivals in the next 10 minutes\u201D is naturally Poisson?",
          options: [
            { text: "The first counts successes among a fixed number of trials; the second counts " +
                    "events occurring in a fixed interval.", correct: true,
              why: "That is the distinction, and it is the one worth carrying out of this chapter. Ask " +
                   "first: is there a fixed set of things each of which either does or does not " +
                   "happen, or is there an interval in which events accumulate at some rate?" },
            { text: "Because no-shows are common and walk-ins are rare.", correct: false,
              why: "Frequency is not what separates them. Poisson is for event counts over a " +
                   "specified interval given an average rate \u2014 the rate can be high or low." },
            { text: "Because one is discrete and the other is continuous.", correct: false,
              why: "Both are counts, so both are discrete. What differs is what is being counted " +
                   "over: a fixed number of trials, or an interval." },
            { text: "Because the binomial needs a large sample and the Poisson does not.", correct: false,
              why: "Neither claim holds. The choice follows from the structure of the question, not " +
                   "from how much data there is." }
          ]
        }).el);

        meaning.innerHTML = "<h3>Reading it correctly</h3><div class='meaning'>" +
          "<div><strong>What probability can tell you</strong>These models quantify uncertainty under " +
          "stated assumptions \u2014 given the mean and spread, or the n and p, or the rate, they say " +
          "how likely each outcome is.</div>" +
          "<div><strong>What it does not guarantee</strong>A 20% probability does not mean the event " +
          "occurs in exactly one of every five nights. Over a small number of cases the realised " +
          "counts scatter around the model, sometimes well away from it.</div>" +
          "<div><strong>What a manager could reasonably do</strong>Use the model to quantify the " +
          "likelihood of operational outcomes and to compare scenarios \u2014 remembering that the " +
          "answer depends on the assumptions and the inputs, both of which are chosen rather than " +
          "observed.</div></div>";
      }

      function line(svg, x1, y1, x2, y2, stroke, w, dash) {
        var a = { x1: x1, y1: y1, x2: x2, y2: y2, stroke: stroke, "stroke-width": w };
        if (dash) a["stroke-dasharray"] = dash;
        svg.appendChild(svgEl("line", a));
      }
      function txt(svg, x, y, s, size, fill, anchor) {
        var n = svgEl("text", { x: x, y: y, "font-size": size, fill: fill, "text-anchor": anchor,
          "font-family": "Segoe UI, Arial, sans-serif" });
        n.textContent = s;
        svg.appendChild(n);
      }

      picker.value = FAMILIES[0].id;
      setFamily(FAMILIES[0].id);
    }
  };

  H.mount(pageModule);

})(typeof window !== "undefined" ? window : globalThis);

</script>
</body>
</html>
