<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTM 514 Interactive — Regression Interpretation Trainer</title>
<meta name="description" content="Optional HTM 514 practice interactive: turning a regression coefficient into a defensible business sentence.">
<style>
/* ==========================================================================
   HTM 514 Interactive — common shell stylesheet
   Purdue-compatible restrained palette: white, black, Boilermaker Gold, grays.
   Reused by every HTM 514 interactive module.
   ========================================================================== */

:root {
  --gold: #CFB991;
  --gold-deep: #8E7B4F;
  --gold-wash: #F7F3EA;
  --ink: #131313;
  --ink-soft: #3D3D3D;
  --gray: #6B6B6B;
  --rule: #DCDCDC;
  --rule-soft: #EDEDED;
  --panel: #FAFAFA;
  --ok: #1F5C3D;
  --no: #8A2B22;
  --maxw: 880px;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: #FFFFFF;
  color: var(--ink);
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
}

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 28px 20px 72px;
}

/* ---------- masthead ---------- */

.masthead { border-bottom: 3px solid var(--gold); padding-bottom: 14px; margin-bottom: 26px; }

.eyebrow {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--gray);
  margin: 0 0 6px;
}

.masthead h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 27px;
  line-height: 1.25;
  margin: 0 0 6px;
  font-weight: 600;
}

.masthead .sub { margin: 0; color: var(--ink-soft); font-size: 15px; }

.fit {
  margin-top: 10px;
  font-size: 13px;
  color: var(--gray);
}

/* ---------- steps ---------- */

.step {
  border-top: 1px solid var(--rule);
  padding: 22px 0 6px;
}

.step[data-locked="true"] { opacity: .45; }
.step[data-locked="true"] .step-body { display: none; }

.step-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}

.step-num {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  background: var(--gold);
  border-radius: 2px;
  padding: 2px 8px;
  flex: 0 0 auto;
}

.step h2 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 19px;
  font-weight: 600;
  margin: 0;
}

.step .hint { font-size: 13px; color: var(--gray); margin: 0 0 12px; }

/* ---------- generic content ---------- */

p { margin: 0 0 12px; }
.scenario-text { font-family: Georgia, "Times New Roman", serif; font-size: 16.5px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--rule);
  padding: 14px 16px;
  margin: 0 0 14px;
}

.panel h3 {
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--gray);
  margin: 0 0 8px;
  font-weight: 700;
}

.meaning { display: grid; grid-template-columns: 1fr; gap: 10px; }
.meaning div { border-left: 3px solid var(--gold); padding-left: 12px; }
.meaning strong { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--gray); }

/* ---------- controls ---------- */

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-end;
  margin-bottom: 16px;
}

.control { display: flex; flex-direction: column; gap: 4px; }
.control label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--gray); }

button, select, input[type="range"] { font: inherit; }

button {
  background: #FFFFFF;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 8px 14px;
  cursor: pointer;
  border-radius: 2px;
}

button:hover { background: var(--gold-wash); }
button.primary { background: var(--gold); border-color: var(--gold-deep); font-weight: 600; }
button.primary:hover { background: #C4AC7E; }
button.quiet { border-color: var(--rule); color: var(--ink-soft); }
button[disabled] { opacity: .45; cursor: not-allowed; }

select { padding: 7px 8px; border: 1px solid var(--rule); border-radius: 2px; background: #fff; }

input[type="range"] { width: 190px; accent-color: var(--gold-deep); }

:focus-visible {
  outline: 3px solid var(--gold-deep);
  outline-offset: 2px;
}

.checkline { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); }

/* ---------- choice sets (prediction + quick check) ---------- */

.choices { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }

.choice {
  text-align: left;
  padding: 10px 14px;
  border: 1px solid var(--rule);
  background: #fff;
  border-radius: 2px;
  cursor: pointer;
  line-height: 1.45;
}

.choice:hover { border-color: var(--ink); background: var(--gold-wash); }
.choice[aria-pressed="true"] { border-color: var(--gold-deep); border-left-width: 5px; background: var(--gold-wash); }
.choice[data-verdict="ok"] { border-color: var(--ok); border-left: 5px solid var(--ok); }
.choice[data-verdict="no"] { border-color: var(--no); border-left: 5px solid var(--no); }

.feedback {
  border-left: 4px solid var(--gold);
  background: var(--gold-wash);
  padding: 12px 14px;
  margin: 0 0 12px;
  font-size: 15px;
}
.feedback[data-verdict="ok"] { border-left-color: var(--ok); }
.feedback[data-verdict="no"] { border-left-color: var(--no); }
.feedback .verdict { font-weight: 700; }

/* ---------- charts + readouts ---------- */

.charts { display: grid; grid-template-columns: 1fr; gap: 18px; margin-bottom: 16px; }
@media (min-width: 720px) { .charts { grid-template-columns: 1fr 1fr; } }

.chart-box { border: 1px solid var(--rule); padding: 10px 12px 12px; }
.chart-box h3 { font-size: 13px; margin: 0 0 2px; font-weight: 700; }
.chart-box .cap { font-size: 12px; color: var(--gray); margin: 0 0 8px; }
canvas { width: 100%; height: auto; display: block; }

.readout { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 14px; }
.readout caption { caption-side: top; text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gray); padding-bottom: 6px; }
.readout th, .readout td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule-soft); }
.readout th { font-weight: 600; color: var(--ink-soft); }
.readout td.num { font-variant-numeric: tabular-nums; }

.runlog th, .runlog td { text-align: right; }
.runlog th:first-child, .runlog td:first-child { text-align: left; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.footer {
  margin-top: 34px;
  border-top: 1px solid var(--rule);
  padding-top: 12px;
  font-size: 12.5px;
  color: var(--gray);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
/* ==========================================================================
   HTM 514 Interactive — common shell (vanilla JS, no dependencies)

   Provides the pieces every HTM 514 mini-module reuses:
     HTM514.rng          seeded pseudo-random generator (reproducible)
     HTM514.draw         random variates built on a seeded rng
     HTM514.stats        mean, population/sample SD, min, max, binning
     HTM514.fmt          number formatting helpers
     HTM514.Steps        progressive step disclosure (locked -> unlocked)
     HTM514.Choices      one prediction / quick-check question with feedback
     HTM514.QuickCheck   randomized draw from a question pool
     HTM514.Histogram    canvas histogram with a shared x-axis + text summary
     HTM514.mount        assembles the page from a module definition

   A module supplies content and its own "Try it" panel; the shell supplies
   layout, flow, feedback, and charting.
   ========================================================================== */

(function (global) {
  "use strict";

  /* ---------- seeded RNG (mulberry32) ---------- */

  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var draw = {
    normal: function (r, mu, sd) {
      var u = 1 - r(), v = r();
      return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
    exponential: function (r, theta) { return -Math.log(1 - r()) * theta; },
    gamma: function (r, shapeInt, theta) {
      var s = 0;
      for (var i = 0; i < shapeInt; i++) s += draw.exponential(r, theta);
      return s;
    },
    poisson: function (r, lambda) {
      var L = Math.exp(-lambda), k = 0, p = 1;
      do { k++; p *= r(); } while (p > L);
      return k - 1;
    }
  };

  /* ---------- statistics ---------- */

  var stats = {
    mean: function (a) { var s = 0, i; for (i = 0; i < a.length; i++) s += a[i]; return s / a.length; },
    sdPop: function (a) {
      var m = stats.mean(a), s = 0, i;
      for (i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m);
      return Math.sqrt(s / a.length);
    },
    sdSample: function (a) {
      if (a.length < 2) return NaN;
      var m = stats.mean(a), s = 0, i;
      for (i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m);
      return Math.sqrt(s / (a.length - 1));
    },
    min: function (a) { return Math.min.apply(null, a); },
    max: function (a) { return Math.max.apply(null, a); },
    bin: function (values, lo, hi, k) {
      var counts = new Array(k), i, idx, w = (hi - lo) / k;
      for (i = 0; i < k; i++) counts[i] = 0;
      for (i = 0; i < values.length; i++) {
        idx = Math.floor((values[i] - lo) / w);
        if (idx < 0) idx = 0;
        if (idx >= k) idx = k - 1;
        counts[idx]++;
      }
      return counts;
    }
  };

  /* ---------- formatting ---------- */

  var fmt = {
    n: function (x, d) {
      if (!isFinite(x)) return "—";
      return x.toFixed(d === undefined ? 2 : d);
    },
    withUnit: function (x, unit, d) {
      if (!isFinite(x)) return "—";
      var v = fmt.n(x, d);
      return unit.prefix ? unit.prefix + v : v + (unit.suffix || "");
    }
  };

  /* ---------- small DOM helpers ---------- */

  function h(tag, attrs, kids) {
    var node = document.createElement(tag), k;
    if (attrs) for (k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k.indexOf("on") === 0) node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function announce(msg) {
    var live = document.getElementById("htm514-live");
    if (live) live.textContent = msg;
  }

  /* ---------- step flow ---------- */

  function Steps(root) { this.root = root; this.list = []; }

  Steps.prototype.add = function (opts) {
    var body = h("div", { class: "step-body" });
    var sec = h("section", { class: "step", id: "step-" + opts.id }, [
      h("div", { class: "step-head" }, [
        h("span", { class: "step-num", text: String(this.list.length + 1) }),
        h("h2", { text: opts.title })
      ]),
      body
    ]);
    if (opts.hint) body.appendChild(h("p", { class: "hint", text: opts.hint }));
    if (opts.locked) sec.setAttribute("data-locked", "true");
    this.root.appendChild(sec);
    var entry = { id: opts.id, section: sec, body: body };
    this.list.push(entry);
    return entry;
  };

  Steps.prototype.unlock = function (id, focusIt) {
    var e = this.list.filter(function (s) { return s.id === id; })[0];
    if (!e) return;
    e.section.removeAttribute("data-locked");
    if (focusIt) e.section.scrollIntoView({ block: "nearest" });
  };

  /* ---------- one multiple-choice question with feedback ---------- */

  function Choices(question, onAnswer) {
    // question: {stem, options:[{text, correct, why}], shuffle:false to keep order}
    if (question.shuffle !== false) {
      var opts = question.options.slice(), j, tmp, i2;
      for (i2 = opts.length - 1; i2 > 0; i2--) {
        j = Math.floor(Math.random() * (i2 + 1));
        tmp = opts[i2]; opts[i2] = opts[j]; opts[j] = tmp;
      }
      question = { stem: question.stem, options: opts };
    }
    var wrap = h("div");
    if (question.stem) wrap.appendChild(h("p", { class: "scenario-text", html: question.stem }));
    var box = h("div", { class: "choices" });
    var fb = h("div", { class: "feedback", hidden: "hidden" });
    var answered = false;

    question.options.forEach(function (opt, i) {
      var b = h("button", {
        class: "choice", type: "button", "aria-pressed": "false", html: opt.text,
        onclick: function () {
          if (answered) return;
          answered = true;
          Array.prototype.forEach.call(box.children, function (c, j) {
            c.setAttribute("aria-pressed", j === i ? "true" : "false");
            if (question.options[j].correct) c.setAttribute("data-verdict", "ok");
            else if (j === i) c.setAttribute("data-verdict", "no");
          });
          var verdict = opt.correct ? "ok" : "no";
          fb.setAttribute("data-verdict", verdict);
          fb.innerHTML = '<span class="verdict">' + (opt.correct ? "Correct." : "Not quite.") + "</span> " + opt.why;
          fb.hidden = false;
          announce((opt.correct ? "Correct. " : "Not quite. ") + fb.textContent);
          if (onAnswer) onAnswer(i, opt);
        }
      });
      box.appendChild(b);
    });

    wrap.appendChild(box);
    wrap.appendChild(fb);
    this.el = wrap;
  }

  /* ---------- quick check: randomized draw from a pool ---------- */

  function QuickCheck(pool, seed) {
    var self = this;
    var r = rng(seed || 20240514);
    var used = [];
    var host = h("div");
    var slot = h("div");
    var again = h("button", {
      class: "quiet", type: "button", text: "Another question",
      onclick: function () { self.next(); }
    });

    this.next = function () {
      if (used.length >= pool.length) used = [];
      var candidates = pool.map(function (q, i) { return i; }).filter(function (i) { return used.indexOf(i) < 0; });
      var pick = candidates[Math.floor(r() * candidates.length)];
      used.push(pick);
      slot.innerHTML = "";
      slot.appendChild(new Choices(pool[pick]).el);
    };

    host.appendChild(slot);
    host.appendChild(again);
    this.el = host;
    this.next();
  }

  /* ---------- canvas histogram ---------- */

  function Histogram(canvas, opts) {
    this.c = canvas;
    this.opts = opts || {};
    this.values = [];
    this.marks = [];
  }

  Histogram.prototype.set = function (values, marks) {
    this.values = values || [];
    this.marks = marks || [];
    this.render();
  };

  Histogram.prototype.render = function () {
    var o = this.opts, c = this.c;
    var dpr = global.devicePixelRatio || 1;
    var W = c.clientWidth || 400, H = o.height || 190;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.height = H + "px";
    var g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);

    var padL = 6, padR = 6, padB = 26, padT = 8;
    var lo = o.lo, hi = o.hi, k = o.bins || 44;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var counts = this.values.length ? stats.bin(this.values, lo, hi, k) : new Array(k).fill(0);
    var peak = Math.max.apply(null, counts) || 1;
    var bw = plotW / k;

    // bars
    g.fillStyle = o.fill || "#CFB991";
    g.strokeStyle = "#8E7B4F";
    g.lineWidth = 0.5;
    for (var i = 0; i < k; i++) {
      if (!counts[i]) continue;
      var bh = (counts[i] / peak) * plotH;
      var x = padL + i * bw;
      g.fillRect(x, padT + plotH - bh, Math.max(bw - 0.6, 0.8), bh);
      g.strokeRect(x, padT + plotH - bh, Math.max(bw - 0.6, 0.8), bh);
    }

    // baseline
    g.strokeStyle = "#131313"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(padL, padT + plotH + 0.5); g.lineTo(W - padR, padT + plotH + 0.5); g.stroke();

    // vertical marks (e.g., the true population mean)
    var self = this;
    this.marks.forEach(function (m) {
      if (m.value < lo || m.value > hi) return;
      var x = padL + ((m.value - lo) / (hi - lo)) * plotW;
      g.save();
      g.strokeStyle = m.color || "#131313";
      g.setLineDash(m.dash || [4, 3]);
      g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(x, padT); g.lineTo(x, padT + plotH); g.stroke();
      g.restore();
      if (m.label) {
        g.fillStyle = "#131313";
        g.font = "11px Segoe UI, Arial, sans-serif";
        var tw = g.measureText(m.label).width;
        var tx = Math.min(Math.max(x - tw / 2, padL), W - padR - tw);
        g.fillText(m.label, tx, padT + 10);
      }
      void self;
    });

    // axis labels
    g.fillStyle = "#6B6B6B";
    g.font = "11px Segoe UI, Arial, sans-serif";
    g.fillText(o.loLabel || "", padL, H - 8);
    var hiLab = o.hiLabel || "";
    g.fillText(hiLab, W - padR - g.measureText(hiLab).width, H - 8);
    if (o.axisLabel) {
      var al = o.axisLabel;
      g.fillText(al, padL + plotW / 2 - g.measureText(al).width / 2, H - 8);
    }
  };

  /* ---------- page assembly ---------- */

  function mount(module) {
    var root = document.getElementById("app");
    root.innerHTML = "";

    root.appendChild(h("header", { class: "masthead" }, [
      h("p", { class: "eyebrow", text: "HTM 514 Interactive · optional practice" }),
      h("h1", { text: module.title }),
      h("p", { class: "sub", text: module.subtitle }),
      h("p", { class: "fit", text: module.courseFit })
    ]));

    var steps = new Steps(root);
    module.build(steps, { h: h, announce: announce });

    root.appendChild(h("div", { class: "footer", html: module.footer || "" }));
    root.appendChild(h("div", { id: "htm514-live", class: "sr-only", "aria-live": "polite" }));
  }

  global.HTM514 = {
    rng: rng, draw: draw, stats: stats, fmt: fmt,
    h: h, announce: announce,
    Steps: Steps, Choices: Choices, QuickCheck: QuickCheck, Histogram: Histogram,
    mount: mount
  };

  if (typeof module !== "undefined" && module.exports) module.exports = global.HTM514;

})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ==========================================================================
   HTM 514 Interactive — Module 7
   "Regression Interpretation Trainer"

   Fits beside Week 14 (Regression). This is a reading exercise, not a
   calculator: the output is given, and the student turns one coefficient
   into a sentence a manager could defend.

   The course's own lines are the spine of the module:
     "OLS uses COEFFICIENT(beta) ... Relationship, NOT CAUSE & EFFECT"
     "We can predict only based on the range of predictors"
     "R-Square evaluate the model; Beta denote the predict level"
     "More Predictors = Higher R^2"

   Uses the frozen shell in assets/htm514-shell.js without modification.
   No network, no storage.
   ========================================================================== */

(function (global) {
  "use strict";

  var HAS_DOM = typeof document !== "undefined";
  var H = global.HTM514 ||
    (typeof require === "function" ? require("../assets/htm514-shell.js") : null);

  /* ================================================================= math ==
     Every displayed row is derived from a coefficient and a standard error:
     t = b / SE, and p is the two-sided t tail on the model's residual df.
     Nothing is hand-typed, so no row can be internally inconsistent.

     The t tail uses the regularized incomplete beta (Lentz continued
     fraction, Lanczos log-gamma) — the same helper as Modules 4 to 6,
     duplicated here because those modules are frozen and this package has to
     deploy on its own.
     ====================================================================== */

  function lnGamma(z) {
    var g = [676.5203681218851, -1259.1392167224028, 771.32342877765313,
             -176.61502916214059, 12.507343278686905, -0.13857109526572012,
             9.9843695780195716e-6, 1.5056327351493116e-7];
    if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lnGamma(1 - z);
    z -= 1;
    var x = 0.99999999999980993, i;
    for (i = 0; i < 8; i++) x += g[i] / (z + i + 1);
    var t = z + 7.5;
    return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
  }

  function betacf(a, b, x) {
    var MAXIT = 200, EPS = 3e-14, FPMIN = 1e-300;
    var qab = a + b, qap = a + 1, qam = a - 1;
    var c = 1, d = 1 - qab * x / qap, h, m, m2, aa, del;
    if (Math.abs(d) < FPMIN) d = FPMIN;
    d = 1 / d; h = d;
    for (m = 1; m <= MAXIT; m++) {
      m2 = 2 * m;
      aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d; del = d * c; h *= del;
      if (Math.abs(del - 1) < EPS) break;
    }
    return h;
  }

  function betai(a, b, x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var bt = Math.exp(lnGamma(a + b) - lnGamma(a) - lnGamma(b) +
                      a * Math.log(x) + b * Math.log(1 - x));
    return x < (a + 1) / (a + b + 2)
      ? bt * betacf(a, b, x) / a
      : 1 - bt * betacf(b, a, 1 - x) / b;
  }

    return { b: b, se: se, df: df, t: t, p: pTwoSided(t, df) };

        return { id: r.id, name: r.name, kind: r.kind, b: s.b, se: s.se, t: s.t, p: s.p, df: d, meta: r };

    var dir = b < 0 ? "lower" : "higher";
    var mag = Math.abs(b);
    var unit = mag === 1 ? sc.outcomeUnit : sc.outcomeUnitPlural;
    var num = trimNum(mag);

    if (row.kind === "dummy") {
      return "Holding the other predictors in this model constant, " + row.meta.group +
             " are associated with an estimated " + num + " " + unit + " " + dir + " " + sc.outcome +
             " than " + row.meta.reference + ", the reference category.";
    }
    if (row.kind === "interaction") {

             "between the other predictor and " + sc.outcome + " changes by " + num + " " + unit +
             " for " + row.meta.partner + " compared with the reference category.";
    }
    if (row.meta.interactsWith && !opts.universal) {
      return "For " + row.meta.interactionRef + ", the reference category, and holding the other " +
             "included predictors constant, " + step + " is associated with an estimated " + num +
             " " + unit + " " + dir + " " + sc.outcome + " in these data.";
    }

           " is associated with an estimated " + num + " " + unit + " " + dir + " " + sc.outcome +

            r.t.toFixed(2) + "</td><td class='num'>" + pOnly(r.p) + "</td></tr>";
        });
        body += "<tr><th scope='row'>R\u00B2</th><td colspan='4'>" +
          sc.r2.toFixed(2).replace(/^0/, "") + "</td></tr>";
        outTable.innerHTML = head + body;
        outCap.textContent = "The highlighted row is marked with an arrow and the word \u201C" +
          "highlighted\u201D, not by shading alone. Every t is the coefficient divided by its standard " +
          "error, and every p follows from that t on " + m.df + " degrees of freedom.";
      }

      function renderInterpret() {
        var sc = state.sc, row = focusRow();
        interpretSlot.innerHTML = "";
        var right = sentenceFor(sc, row);
        var opts;

        if (row.kind === "dummy") {
          opts = [
            { text: right, correct: true,
              why: "It names the comparison group, the reference category, the estimated size with its " +
                   "unit, and it says <em>associated with</em> rather than <em>causes</em>." },
            { text: "A one-unit increase in " + row.name.replace(/ \(1 = yes\)/, "") +
                    " is associated with an estimated " + num(row.b) + " " + sc.outcomeUnitPlural +
                    " higher " + sc.outcome + ".", correct: false,
              why: "Although 0 \u2192 1 is numerically a one-unit change, this coefficient is most " +
                   "clearly read as the estimated difference between the indicated group and the " +
                   "reference category, holding the other included predictors constant. The " +
                   "one-unit phrasing gets the arithmetic right and hides what is being compared." },
            { text: row.meta.causalPhrase + " " + sc.outcome + " by " + num(row.b) + " " +
                    sc.outcomeUnitPlural + ".", correct: false,
              why: "\u201CRaises\u201D is a causal claim. The course is explicit that OLS gives a " +
                   "relationship, not cause and effect." },
            { text: right.replace("Holding the other predictors in this model constant, ", ""),
              correct: false,
              why: "Everything else is right, but dropping <em>holding the other predictors constant</em> " +
                   "changes what is being claimed: this is a conditional comparison inside a model with " +
                   "three predictors, not a raw group difference." }
          ];
        } else {
          opts = [
            { text: right, correct: true,
              why: "It names the unit of the predictor, the size and unit of the estimated change, the " +
                   "conditioning, and it stays with <em>associated with</em>." },
            { text: sc.outcome.charAt(0).toUpperCase() + sc.outcome.slice(1) + " " +
                    (row.b < 0 ? "falls" : "rises") + " by " + num(Math.abs(row.b)) +
                    (sc.id === "occupancy" ? "%" : " " + sc.outcomeUnitPlural) + " for " +
                    row.meta.unitStep + ".", correct: false,
              why: sc.id === "occupancy"
                ? "Two problems. It reads as a guaranteed change rather than an estimated association, " +
                  "and it says <em>%</em> when the outcome is measured in percent \u2014 a move of 1.8 " +
                  "<em>percentage points</em> is not a 1.8 <em>percent</em> change."
                : "It reads as a guaranteed change rather than an estimated association, and it drops " +
                  "the conditioning on the other predictors in the model." },
            { text: "Because p = " + pOnly(row.p) + ", " + row.meta.unitStep +
                    " is " + (row.p < 0.05 ? "an important driver of " : "irrelevant to ") + sc.outcome + ".",
              correct: false,
              why: "The p-value describes statistical evidence against a zero-coefficient null under " +
                   "this model. It does not measure importance, and a large p-value does not show a " +
                   "coefficient is zero." },
            (row.meta.interactsWith
              ? { text: sentenceFor(sc, row, { universal: true }), correct: false,
                  why: "This is the sentence you would write if the model had no interaction — and " +
                       "it is the most common mistake here. Because " + row.name.replace(/ \(.*/, "") +
                       " also appears in the " + row.meta.interactsWith + " interaction, this " +
                       "coefficient is the slope for " + row.meta.interactionRef + ", the reference " +
                       "category. For the other group the estimated slope is this coefficient plus the " +
                       "interaction coefficient." }
              : { text: right.replace("Holding the other predictors in this model constant, ", "") +
                        " This holds for every case regardless of the other predictors.", correct: false,
                  why: "The sentence is fine until the last clause. The estimate is a conditional " +
                       "comparison inside this model, not a universal rule." })
          ];
        }

        interpretSlot.appendChild(new H.Choices({
          stem: "The highlighted coefficient is <strong>" + num(row.b) + "</strong> (" + row.name +
                "), with " + fmtP(row.p) + ". Which sentence would you put in a report?",
          options: opts
        }, function () {
          ["change", "read", "manager", "check"].forEach(function (k) { steps.unlock(k); });
          H.announce("The variants are now available below.");
        }).el);
      }

      /* --------------------------------------------------------- variants - */

      function variants() {
        var sc = state.sc, row = focusRow();
        var list = [
          { id: "base", label: "As reported",
            row: { b: row.b, se: row.se, t: row.t, p: row.p },
            note: "The row exactly as the model reported it." },
          { id: "sign", label: "Sign flipped",
            row: { b: -row.b, se: row.se, t: -row.t, p: row.p },
            note: "Only the sign changed. The magnitude, the standard error, the size of t and the " +
                  "p-value are all identical \u2014 the direction of the association reversed, and " +
                  "nothing about the strength of the evidence did." },
          { id: "se", label: "More uncertainty",
            row: (function () { var s = stat(row.b, row.se * 2.2, row.df); return s; })(),
            note: "Same estimate, a standard error more than twice as wide. t = b / SE falls, so the " +
                  "evidence against a zero coefficient weakens \u2014 without the estimate itself " +
                  "moving at all." }
        ];
        if (row.meta.rescale && !row.meta.interactsWith) {
          list.splice(2, 0, {
            id: "units", label: "Different units (" + row.meta.rescale.label + ")",
            row: (function () {
              var r = rescale(row, row.meta.rescale.factor);
              return { b: r.b, se: r.se, t: row.t, p: row.p };
            })(),
            rescaled: true,
            note: "The coefficient and its standard error are both multiplied by " +
                  row.meta.rescale.factor + ", so t and p do not move by even a thousandth. The " +
                  "relationship is the same; the yardstick changed."
          });
        } else if (row.meta.interactsWith) {
          list.splice(2, 0, {
            id: "units", label: "Different units?", row: null,
            refusal: "Because this predictor also appears in an interaction, changing its units would " +
                     "require rescaling both the main-effect and interaction rows.",
            note: "Because this predictor also appears in an interaction, changing its units would " +
                  "require rescaling both the main-effect and interaction rows. Try the unit exercise " +
                  "in another model."
          });
        } else {
          list.splice(2, 0, {
            id: "units", label: "Different units?", row: null,
            refusal: "This row is an indicator: it is already a comparison between two categories, so " +
                     "there are no units to double or divide.",
            note: "Rescaling does not apply here. This row is an indicator: it is already a comparison " +
                  "between two categories, so there are no units to double or divide."
          });
        }
        return list;
      }

      function renderVariants() {
        var sc = state.sc, row = focusRow(), list = variants();
        variantBtns.innerHTML = "";
        list.forEach(function (v) {
          variantBtns.appendChild(h("button", {
            type: "button", "data-variant": v.id, text: v.label,
            "aria-pressed": v.id === state.variant ? "true" : "false",
            class: v.id === state.variant ? "primary" : "",
            onclick: function () { state.variant = v.id; renderVariants(); }
          }));
        });
        var v = list.filter(function (x) { return x.id === state.variant; })[0];
        if (!v.row) {
          variantRow.innerHTML = "<caption>" + row.name + "</caption>" +
            "<tr><td>" + v.refusal + "</td></tr>";
          variantSay.setAttribute("data-verdict", "");
          variantSay.innerHTML = "<span class='verdict'>Nothing to rescale.</span> " +
            sentenceFor(sc, row);
        } else {
          variantRow.innerHTML = "<caption>" + row.name +
            (v.rescaled ? " \u2014 " + v.label : "") + "</caption>" +
            "<tr><th scope='col'>Coefficient</th><th scope='col'>Std. error</th>" +
            "<th scope='col'>t</th><th scope='col'>p</th></tr>" +
            "<tr><td class='num'>" + num(v.row.b) + "</td><td class='num'>" + se3(v.row.se) +
            "</td><td class='num'>" + v.row.t.toFixed(2) + "</td><td class='num'>" +
            pOnly(v.row.p) + "</td></tr>";
          variantSay.setAttribute("data-verdict", "ok");
          variantSay.innerHTML = "<span class='verdict'>Say it like this:</span> " +
            sentenceFor(sc, row, { b: v.row.b, rescaled: !!v.rescaled });
        }
        variantWhy.innerHTML = v.note;
        H.announce(v.label + " selected.");
      }

      /* ------------------------------------------------------ read the model */

      function renderRead() {
        var sc = state.sc, m = state.m, pct = Math.round(sc.r2 * 100);
        r2Slot.innerHTML = "";
        r2Slot.appendChild(new H.Choices({
          stem: "This model reports <strong>R\u00B2 = " + sc.r2.toFixed(2).replace(/^0/, "") +
                "</strong>. Which reading is right?",
          options: [
            { text: "About " + pct + "% of the observed variation in " + sc.outcome +
                    " is explained by the predictors included in this model.", correct: true,
              why: "And one caution the lecture makes directly: more predictors can only push R\u00B2 " +
                   "up, so a higher R\u00B2 does not automatically mean a better model for the question " +
                   "you are asking." },
            { text: "The model is " + pct + "% accurate.", correct: false,
              why: "R\u00B2 is a share of variation explained, not an accuracy rate. It says nothing " +
                   "about how far a single prediction lands from what actually happened." },
            { text: "The predictors cause " + pct + "% of " + sc.outcome + ".", correct: false,
              why: "Explained variation is not caused variation. R\u00B2 is computed from the same " +
                   "correlational fit as the coefficients." },
            { text: "There is a " + pct + "% probability that the model is correct.", correct: false,
              why: "R\u00B2 is not a probability and nothing here assigns one to a model being right." }
          ]
        }).el);

        interceptSlot.innerHTML = "";
        interceptSlot.appendChild(new H.Choices({
          stem: "The intercept is <strong>" + num(m.intercept.b) + "</strong>. What is it?",
          options: [
            { text: "The predicted " + sc.outcome + " when every quantitative predictor equals zero " +
                    "and each indicator is at its reference category.", correct: true,
              why: "Mechanically right \u2014 and worth one more step: " + sc.intercept.why },
            { text: "The average " + sc.outcome + " across the sample.", correct: false,
              why: "That would coincide only if every predictor averaged exactly zero." },
            { text: "The share of " + sc.outcome + " the predictors cannot explain.", correct: false,
              why: "That is the residual variation, which R\u00B2 speaks to \u2014 not the intercept." }
          ]
        }).el);
      }

      /* ---------------------------------------------------------- manager - */

      function renderManager() {
        var sc = state.sc, m = state.m;
        var big = rowById(m, sc.contrast.big), small = rowById(m, sc.contrast.small);
        contrastBox.innerHTML = "<h3>Two rows worth comparing</h3>" +
          "<table class='readout'><tr><th scope='col'>Predictor</th><th scope='col'>Coefficient</th>" +
          "<th scope='col'>Std. error</th><th scope='col'>p</th></tr>" +
          "<tr><th scope='row'>" + big.name + "</th><td class='num'>" + num(big.b) + "</td>" +
          "<td class='num'>" + se3(big.se) + "</td><td class='num'>" + pOnly(big.p) + "</td></tr>" +
          "<tr><th scope='row'>" + small.name + "</th><td class='num'>" + num(small.b) + "</td>" +
          "<td class='num'>" + se3(small.se) + "</td><td class='num'>" + pOnly(small.p) + "</td></tr>" +
          "</table><p>Neither number by itself settles which matters more to the business. The " +
          "coefficients are in different units, so their sizes are not comparable as printed; and the " +
          "p-values describe statistical evidence relative to each estimate's uncertainty, not " +
          "managerial value. " + sc.practical + "</p>";

        causeSlot.innerHTML = "";
        var focus = rowById(m, sc.focus);
        causeSlot.appendChild(new H.Choices({
          stem: "The highlighted coefficient is " + num(focus.b) + " with " + fmtP(focus.p) +
                ". Which conclusion is justified <em>from this regression alone</em>?",
          options: [
            { text: "Within these data, " + (focus.kind === "dummy" ? focus.meta.group : "higher values " +
                    "of this predictor") + " are associated with " + (focus.b < 0 ? "lower " : "higher ") +
                    sc.outcome + ", conditional on the other predictors in the model" +
                    (focus.meta.interactsWith
                      ? " and, because of the interaction, for " + focus.meta.interactionRef +
                        " \u2014 the reference category." : ".") , correct: true,
              why: "It stays with what the model estimates: a conditional association among the " +
                   "included variables" + (focus.meta.interactsWith
                        ? ", and for the group this coefficient actually describes." : ".") },
            { text: "Changing this predictor would move " + sc.outcome + " by exactly " +
                    num(Math.abs(focus.b)) + " " + sc.outcomeUnitPlural + ".", correct: false,
              why: "Two claims at once, and both go beyond the output: that an intervention would " +
                   "produce this change, and that it would be exact rather than estimated with error." },
            { text: "The regression has ruled out other explanations for the pattern.", correct: false,
              why: "It has adjusted for the predictors it includes. Anything omitted is not accounted " +
                   "for \u2014 the course's assumption list calls a missing critical predictor the " +
                   "primary danger." }
          ]
        }).el);

        extraSlot.innerHTML = "";
        var inter = m.rows.filter(function (r) { return r.kind === "interaction"; })[0];
        if (inter) {
          extraSlot.appendChild(new H.Choices({
            stem: "This model includes <strong>" + inter.name + "</strong>. Can the check-in wait " +
                  "coefficient on its own describe the wait relationship for every guest?",
            options: [
              { text: "No \u2014 with an interaction in the model, the wait relationship depends on " +
                      "loyalty membership.", correct: true,
                why: "The wait coefficient describes the reference category. For members the estimated " +
                     "relationship is that coefficient plus the interaction term, so a single number " +
                     "cannot stand for both groups." },
              { text: "Yes \u2014 the interaction is a separate effect and does not change the wait " +
                      "coefficient's meaning.", correct: false,
                why: "It changes it precisely. Once the product term is in the model, the wait " +
                     "coefficient is conditional on the other variable being at its reference value." },
              { text: "Yes, as long as the interaction is statistically significant.", correct: false,
                why: "Significance does not make a conditional estimate universal. It is the presence " +
                     "of the product term that makes the relationship depend on the second variable." }
            ]
          }).el);
        }

        meaning.innerHTML = "<h3>Reading it correctly</h3><div class='meaning'>" +
          "<div><strong>What a coefficient means</strong>An estimated difference in " + sc.outcome +
          " associated with a stated change in the predictor, holding the other predictors in this " +
          "model constant \u2014 in the units both variables are measured in." +
          (m.rows.some(function (r) { return r.kind === "interaction"; })
            ? " In this model one predictor also appears in an interaction, so its coefficient is the " +
              "estimate for the reference category of the other variable, not a single slope for " +
              "everyone."
            : "") + "</div>" +
          "<div><strong>What it does not mean</strong>Not a causal effect: the course's own line is " +
          "that OLS gives relationship, not cause and effect. Not a guaranteed change for any single " +
          "case. Not a claim outside the observed range of the predictors. And a p-value does not " +
          "measure importance \u2014 a nonsignificant coefficient has not been shown to be zero.</div>" +
          "<div><strong>What a manager could reasonably conclude</strong>\u201CIn these data, and " +
          "adjusting for the other predictors in the model, " + sc.outcome + " differs in the direction " +
          "and rough size the coefficient reports. Whether that is worth acting on, and whether acting " +
          "would produce it, are separate questions.\u201D</div></div>";
      }

      picker.value = SCENARIOS[0].id;
      setScenario(SCENARIOS[0].id);
    }
  };

  H.mount(pageModule);

})(typeof window !== "undefined" ? window : globalThis);

</script>
</body>
</html>
